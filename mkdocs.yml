site_name: LoomNet

site_description: "Weaving plausible virtual links from real traces"
site_author: "LoomNet Team"

docs_dir: docs

nav:
  - 愿景层:
    - 为什么需要织虚？: 00-philosophy/why-loomsnet.md
    - 命名与隐喻: 00-philosophy/naming-and-metaphor.md
    - 验证哲学: 00-philosophy/validation-philosophy.md
  - 架构层:
    - 整体架构: 01-architecture/overview.md
    - Playback底座: 01-architecture/the-root.md
    - 【元】切片逻辑: 01-architecture/the-atom.md
    - 编织阶段:
      - 【替】复织旧迹: 01-architecture/stages/replace.md
      - 【造】巧织新境: 01-architecture/stages/craft.md
      - 【拓】幻织未境: 01-architecture/stages/explore.md
    - 评估指标: 01-architecture/validation-dimensions.md
  - 实现层:
    - API参考: 02-implementation/api-reference.md
    - HoloWAN集成: 02-implementation/holowan-integration.md
    - 回放文件格式: 02-implementation/playback-format.md
    - 调试指南: 02-implementation/debugging-guide.md
  - 演进层:
    - 架构决策记录: 03-evolution/design-decisions.md
    - 发展路线图: 03-evolution/roadmap.md
    - 实验与探索:
      - GAN vs Diffusion: 03-evolution/experiments/gan-vs-diffusion.md
      - 状态标签粒度: 03-evolution/experiments/state-label-granularity.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji
  - toc:
      permalink: true
      title: 目录