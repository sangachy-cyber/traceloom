# traceloom 项目配置文件
# 包含项目元数据、依赖管理、代码质量检查和测试配置

[build-system]
# uv 当前对 PEP 621 + 相对路径依赖的支持还不完善，先临时切换setuptools。
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceloom"
version = "0.1.0"
description = "traceloom 网络仿真工具"
authors = [{ name = "traceloom Team", email = "traceloom@example.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "matplotlib>=3.7.0",
    "numpy>=1.25.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "typer>=0.21.1",
    "holowan @ file://${PROJECT_ROOT}/third_party/holowan_python_api",
    "pyarrow>=23.0.0",
    "pytest>=9.0.2",
    "umap-learn>=0.5.7",
    "llvmlite>=0.41.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "pandas-stubs==2.3.3.260113",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/traceloom/traceloom"
BugReports = "https://github.com/traceloom/traceloom/issues"
SourceCode = "https://github.com/traceloom/traceloom"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.0.270",
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings>=0.20.0",
    "mkdocstrings-python>=1.5.0",
    "pandas-stubs"
]

[tool.ruff]
# 与 Black 一致的行长
line-length = 120
exclude = [
    "__pycache__",
    ".git",
    "venv",
    "docs",
    "third_party",
]

[tool.ruff.lint]
# 推荐使用的规则集
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (自动排序导入)
    "C90", # mccabe
    "B",   # flake8-bugbear
]
# 忽略与 Black 冲突的规则
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["traceloom"]

[tool.ruff.format]
# 格式化设置
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.pytest.ini_options]
addopts = "-v --cov=traceloom --cov-report=term-missing"
testpaths = ["tests"]
junit_family = "xunit2"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
index-url = "https://mirrors.huaweicloud.com/repository/pypi/simple"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
